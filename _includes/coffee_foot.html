<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    .git {
      background-image: url(/gitme/assets/images/git.png);
      position: relative;
      display: inline-block;
      background-size: contain;
      /* Modern responsive sizing: min 20px, preferred 2.5vw, max 60px */
      width: clamp(20px, 2.5vw, 60px);
      height: clamp(20px, 2.5vw, 60px);
    }

    /* Make footer responsive on mobile */
    @media (max-width: 600px) {
      .git {
        width: clamp(16px, 3vw, 40px);
        height: clamp(16px, 3vw, 40px);
      }
    }
  </style>
</head>

<body>

<div style="width:100%; text-align:center;">
  <a class="git" href="https://github.com/Adhamkmopp"></a>
</div>
<br>

<div class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">
            {%- if site.author -%}
            {{ site.author | escape }}
            {%- else -%}
            {{ site.title | escape }}
            {%- endif -%}
          </li>
          {%- if site.email -%}
          <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
          <li><a href="https://www.linkedin.com/in/alittlebird/">linkedin/alittlebird</a></li>
          {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-3">
        <p>{{- site.description | escape -}}</p>
      </div>
    </div>
  </div>

</div>

</body>
</html>
